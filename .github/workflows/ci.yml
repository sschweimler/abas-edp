name: Testen und veröffentlichen

# Getestet wird bei jedem Push, veröffentlicht nur bei einem Versions-Tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mehrere Versionen, weil sich der eingebaute Test-Runner zwischen
        # den Hauptversionen unterschiedlich verhaelt - und zwar in beide
        # Richtungen: Node 20 betrachtet jede .js-Datei unterhalb von
        # test/ als Testdatei (Node 18 nur *.test.js), und Node 22 laedt
        # ein Verzeichnisargument als Modul statt es zu durchsuchen. An
        # beidem ist je ein CI-Lauf gescheitert, waehrend lokal alles
        # gruen war.
        node: ["18", "20", "22"]
    name: Tests (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    # Nur für Versions-Tags, und nur wenn die Tests durch sind.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Ohne diese Berechtigung darf der mitgelieferte GITHUB_TOKEN nicht
      # in die GitHub-Package-Registry schreiben.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
